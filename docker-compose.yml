# Stack local: scraper batch + PostgreSQL para persistência opcional.
# Uso: docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scraper
      POSTGRES_PASSWORD: scraper
      POSTGRES_DB: books
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U scraper -d books']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  scraper:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://scraper:scraper@db:5432/books
      OUTPUT_DIR: /app/data
    volumes:
      - ./output:/app/data

volumes:
  postgres_data:
